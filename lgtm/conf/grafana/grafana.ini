[paths]
data = $__env{LGTM_HOME}/data/grafana
logs = $__env{LGTM_HOME}/data/grafana/log
plugins = $__env{LGTM_HOME}/data/grafana/plugins
provisioning = $__env{LGTM_HOME}/conf/grafana/provisioning

[server]
http_addr = 0.0.0.0
http_port = 3000

[security]
admin_user = admin
admin_password = admin

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Admin

[users]
default_language = ja-JP

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console file
