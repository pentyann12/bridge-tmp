# Grafana 起動時に自動登録されるデータソース
# L(Loki) / T(Tempo) / M(Prometheus) を相互にジャンプできるよう関連付けている。
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      # メトリクスのエグザンプラーから Tempo のトレースへ
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    jsonData:
      # ログ行中の traceID=xxxx から Tempo のトレースへ
      derivedFields:
        - name: TraceID
          matcherType: regex
          matcherRegex: 'traceID=(\w+)'
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
        - name: TraceLogs
          matcherType: regex
          matcherRegex: 'traceID=(\w+)'
          url: '/explore?schemaVersion=1&orgId=1&panes=%7B%22t%22%3A%7B%22datasource%22%3A%22loki%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22loki%22%2C%22uid%22%3A%22loki%22%7D%2C%22expr%22%3A%22%7Bservice_name%3D~%5C%22.%2B%5C%22%7D%20%7C%3D%20%5C%22$${__value.raw}%5C%22%22%2C%22queryType%22%3A%22range%22%2C%22editorMode%22%3A%22code%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-7d%22%2C%22to%22%3A%22now%22%7D%7D%7D'
          urlDisplayLabel: Logs for this trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://127.0.0.1:3200
    jsonData:
      streamingEnabled:
        search: true
        metrics: true
      nodeGraph:
        enabled: true
      # サービスグラフ (metrics-generator が Prometheus に書いたメトリクスを使用)
      serviceMap:
        datasourceUid: prometheus
      # スパンから関連ログへ
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service_name
      # スパンから関連メトリクスへ
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service
        queries:
          - name: Request rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[1m]))'
          - name: Error rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags, status_code="STATUS_CODE_ERROR"}[1m]))'
