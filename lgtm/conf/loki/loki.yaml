auth_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_address: 0.0.0.0
  grpc_listen_port: 9096   # Tempo の 9095 と衝突しないよう変更
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: ${LGTM_ROOT}/data/loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: ${LGTM_ROOT}/data/loki/chunks
      rules_directory: ${LGTM_ROOT}/data/loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h

compactor:
  working_directory: ${LGTM_ROOT}/data/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: true

ruler:
  storage:
    type: local
    local:
      directory: ${LGTM_ROOT}/data/loki/rules

analytics:
  reporting_enabled: false
