plugins {
	id 'java'
	id 'application'
	id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.toru_otsuki'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.github.javaparser:javaparser-core:3.28.2'
	implementation 'com.palantir.javapoet:javapoet:0.22.0'

	testImplementation platform('org.junit:junit-bom:6.1.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// 生成コードのコンパイル確認用（生成プロジェクトが使うAPIだけをクラスパスに載せる）
	testImplementation 'org.springframework:spring-web:7.0.10'
	testImplementation 'org.springframework:spring-context:7.0.10'
	testImplementation 'com.fasterxml.jackson.core:jackson-annotations:2.21'
	testImplementation 'org.glassfish.corba:glassfish-corba-omgapi:5.0.3'
}

test {
	useJUnitPlatform()
	// ./gradlew test -Dgolden.update=true でゴールデンファイルを現在の生成結果で更新する
	systemProperty 'golden.update', System.getProperty('golden.update', 'false')
}

application {
	mainClass = 'com.toru_otsuki.bridge_generator.Main'
}

spotless {
	java {
		// 1.37.0はspotless経由だと全ファイルで例外になる（単体実行では動く）ため、spotlessが対応するまで1.36系を使う
		googleJavaFormat('1.36.1')
		target 'src/**/*.java'
		// ゴールデンファイルは生成結果そのものなので整形しない
		targetExclude 'src/test/resources/**'
		importOrder()
		removeUnusedImports()
	}
}